[project]
name = "checkcorruptedimages"
version = "0.4"
description = 'Python module to check for corrupted images using "identify" from ImageMagick as underlying mechanism.'
readme = "README.md"
authors = [
    { name = "Carlos A. Planchón", email = "bubbledoloresuruguay2@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["check", "corrupted", "images"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/carlosplanchon/checkcorruptedimages"
Repository = "https://github.com/carlosplanchon/checkcorruptedimages"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
