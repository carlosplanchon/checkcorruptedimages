[project]
name = "checkcorruptedimages"
version = "1.0.0"
description = "Python module to check for corrupted images by fully decoding them with Pillow in crash-isolated worker processes."
readme = "README.md"
authors = [
    { name = "Carlos A. Planchón", email = "bubbledoloresuruguay2@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pillow>=11",
    "typer>=0.27.1",
]
keywords = ["check", "corrupted", "images", "pillow"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/carlosplanchon/checkcorruptedimages"
Repository = "https://github.com/carlosplanchon/checkcorruptedimages"

[project.scripts]
checkcorruptedimages = "checkcorruptedimages._cli:app"

[project.optional-dependencies]
heif = [
    "pillow-heif>=1.5.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "EXE", "PYI"]
ignore = ["EXE001"]

[tool.mypy]
files = ["checkcorruptedimages"]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["pillow_heif", "pillow_heif.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pillow-heif>=1.5.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]
